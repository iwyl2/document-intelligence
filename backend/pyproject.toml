[project]
name = "document-intelligence"
version = "2.0.0-dev"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Poorna Rajapaksha", email = "poornarajapaksha339@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.159.1",
    "openai>=3.36.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.18",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
document-intelligence = "document_intelligence:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
